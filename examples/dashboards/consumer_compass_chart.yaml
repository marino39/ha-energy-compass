      legend_value: false
    data_generator: "const now = Date.now();\nconst a = entity.attributes;\nconst valid = hass.states['binary_sensor.replace_with_forecast_valid'];\n\
      if (['unknown', 'unavailable'].includes(entity.state) ||\n    (!a.refreshing && (valid?.state !== 'on' || !(Date.parse(a.valid_until)\
      \ > now)))) return [];\nconst left = Math.max(now, start.getTime());\nconst coverage = Date.parse(valid?.attributes?.coverage_end);\n\
      const right = Math.min(end.getTime(), Number.isFinite(coverage) ? coverage : end.getTime());\nif (right <= left) return\
      \ [];\nconst points = new Map([[left, 0], [right, 0]]);\nfor (const row of (a.outlook || [])) {\n  const from = Math.max(left,\
