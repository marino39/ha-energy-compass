- type: markdown
  grid_options:
    columns: full
    rows: auto
  content: '**Now: {{ states(''sensor.replace_with_consumer_compass'') }}** · 4 h history + 20 h ahead.

    Solid colors: history · Lighter: forecast · Empty: no data.

    {% if state_attr(''sensor.replace_with_plan'', ''refreshing'') == true %}

    Recalculating - showing the last available forecast.

    {% elif not is_state(''binary_sensor.replace_with_forecast_valid'', ''on'') %}

    Forecast unavailable - history is shown.

    {% endif %}'
