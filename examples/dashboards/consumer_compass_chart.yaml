# Generated by tools/dashboards/build.py - do not edit; edit the generator and rebuild.
type: grid
column_span: 4
cards:
- type: custom:apexcharts-card
  section_mode: true
  grid_options:
    columns: full
    rows: 4
  header:
    show: true
    title: Consumer Compass - history and forecast
    show_states: false
  graph_span: 24h
  span:
    offset: +20h
  update_interval: 1min
  hours_12: false
  now:
    show: true
    label: Now
    color: '#ffb300'
  yaxis:
  - min: 0
    max: 1
    show: false
  apex_config:
    chart:
      animations:
        enabled: false
      toolbar:
        show: false
      zoom:
        enabled: false
    grid:
      show: false
      padding:
        top: 10
        bottom: 0
        left: 8
        right: 8
    markers:
      size: 0
    dataLabels:
      enabled: false
    xaxis:
      labels:
        datetimeUTC: false
        format: HH:mm
        hideOverlappingLabels: true
      tooltip:
        enabled: false
      axisBorder:
        show: false
      axisTicks:
        show: false
    legend:
      show: true
      position: bottom
      fontSize: 12px
      customLegendItems:
      - BOOST
      - CHEAP
      - NORMAL
      - LIMIT
      markers:
        fillColors:
        - '#2e7d32'
        - '#66bb6a'
        - '#78909c'
        - '#c62828'
      onItemClick:
        toggleDataSeries: false
      onItemHover:
        highlightDataSeries: false
    tooltip:
      shared: false
      intersect: false
      custom: "EVAL:function({seriesIndex, dataPointIndex, w}) {\n  const value = w.globals.series[seriesIndex]?.[dataPointIndex];\n\
        \  if (value !== 1) return '';\n  const timestamp = w.globals.seriesX[seriesIndex]?.[dataPointIndex];\n  if (!Number.isFinite(timestamp))\
        \ return '';\n  const name = w.globals.seriesNames[seriesIndex];\n  const date = new Date(timestamp).toLocaleString('en-GB',\
        \ {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});\n  return '<div style=\"padding:8px 12px\"\
        ><b>' + name + '</b><br>' + date + '</div>';\n}"
  series:
  - entity: sensor.replace_with_consumer_compass
    name: BOOST · history
    color: '#2e7d32'
    type: area
    curve: stepline
    stroke_width: 0
    opacity: 1
    extend_to: now
    show:
      in_header: false
      legend_value: false
    transform: 'return x === ''BOOST'' ? 1 : 0;'
