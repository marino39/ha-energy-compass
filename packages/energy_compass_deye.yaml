# Generated by tools/deye_controller/build.py - do not edit; edit the generator and rebuild.
input_select:
  energy_compass_deye_mode:
    name: Energy Compass Deye mode
    options:
    - 'Off'
    - Simulation
    - Auto
    icon: mdi:compass
input_boolean:
  energy_compass_deye_session:
    name: Energy Compass Deye session ready
    initial: false
  energy_compass_deye_restore_pending:
    name: Energy Compass Deye restore pending
input_datetime:
  energy_compass_deye_session_start:
    name: Energy Compass Deye session start
    has_date: true
    has_time: true
template:
- triggers:
  - trigger: event
    event_type: energy_compass_deye_accept_plan
  sensor:
  - name: Energy Compass Deye plan
    unique_id: energy_compass_deye_plan
    state: '{{ trigger.event.data.snapshot.generated_at }}'
    attributes:
      snapshot: '{{ trigger.event.data.snapshot }}'
- triggers:
  - trigger: event
    event_type: energy_compass_deye_runtime
  sensor:
  - name: Energy Compass Deye runtime
    unique_id: energy_compass_deye_runtime
    state: '{{ trigger.event.data.runtime.get("code", "waiting") }}'
    attributes:
      runtime: '{{ trigger.event.data.runtime }}'
- sensor:
  - name: Energy Compass Deye TOU settings
    unique_id: energy_compass_deye_tou_settings
    state: '{% set ns = namespace(v={}) %}{% for i in range(1,7) %}{% set ns.v = dict(ns.v, **dict([(''number.inverter_deye_program_''
      ~ i ~ ''_power'', states(''number.inverter_deye_program_'' ~ i ~ ''_power''))])) %}{% set ns.v = dict(ns.v, **dict([(''number.inverter_deye_program_''
      ~ i ~ ''_voltage'', states(''number.inverter_deye_program_'' ~ i ~ ''_voltage''))])) %}{% set ns.v = dict(ns.v, **dict([(''number.inverter_deye_program_''
      ~ i ~ ''_soc'', states(''number.inverter_deye_program_'' ~ i ~ ''_soc''))])) %}{% set ns.v = dict(ns.v, **dict([(''select.inverter_deye_program_''
      ~ i ~ ''_charging'', states(''select.inverter_deye_program_'' ~ i ~ ''_charging''))])) %}{% set ns.v = dict(ns.v, **dict([(''time.inverter_deye_program_''
      ~ i ~ ''_time'', states(''time.inverter_deye_program_'' ~ i ~ ''_time''))])) %}{% endfor %}{{ ns.v.values()|reject(''in'',
      [''unknown'',''unavailable''])|list|length }}'
    attributes:
      prefix: inverter_deye_program_
      values: '{% set ns = namespace(v={}) %}{% for i in range(1,7) %}{% set ns.v = dict(ns.v, **dict([(''number.inverter_deye_program_''
        ~ i ~ ''_power'', states(''number.inverter_deye_program_'' ~ i ~ ''_power''))])) %}{% set ns.v = dict(ns.v, **dict([(''number.inverter_deye_program_''
        ~ i ~ ''_voltage'', states(''number.inverter_deye_program_'' ~ i ~ ''_voltage''))])) %}{% set ns.v = dict(ns.v, **dict([(''number.inverter_deye_program_''
        ~ i ~ ''_soc'', states(''number.inverter_deye_program_'' ~ i ~ ''_soc''))])) %}{% set ns.v = dict(ns.v, **dict([(''select.inverter_deye_program_''
        ~ i ~ ''_charging'', states(''select.inverter_deye_program_'' ~ i ~ ''_charging''))])) %}{% set ns.v = dict(ns.v,
        **dict([(''time.inverter_deye_program_'' ~ i ~ ''_time'', states(''time.inverter_deye_program_'' ~ i ~ ''_time''))]))
        %}{% endfor %}{{ ns.v }}'
  - name: Energy Compass Deye next TOU
    unique_id: energy_compass_deye_next_tou
    device_class: timestamp
    state: '{% set ns=namespace(times=[]) %}{% for i in range(1,7) %}{% set raw=states(''time.inverter_deye_program_''~i~''_time'')
      %}{% if raw not in [''unknown'',''unavailable''] %}{% set at=today_at(raw) %}{% set at=at if at > now() else at + timedelta(days=1)
      %}{% set ns.times=ns.times+[at] %}{% endif %}{% endfor %}{{ (ns.times|min).isoformat() if ns.times else none }}'
  - name: Energy Compass Deye deadline
    unique_id: energy_compass_deye_deadline
    device_class: timestamp
    state: '{{ (state_attr(''sensor.energy_compass_deye_plan'',''snapshot'') or {}).get(''valid_until'') }}'
  - name: Energy Compass Deye interval end
    unique_id: energy_compass_deye_interval_end
    device_class: timestamp
    state: '{% set c=state_attr(''sensor.energy_compass_deye_plan'',''snapshot'') or {} %}{% set ns=namespace(end=none) %}{%
      for r in c.get(''intervals'',[]) %}{% if as_timestamp(r.start) <= as_timestamp(now()) < as_timestamp(r.end) %}{% set
      ns.end=r.end %}{% endif %}{% endfor %}{{ ns.end }}'
